name: EduMi Automation Testing CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  smoke-test:
    name: Run E2E Smoke Test (Headless Chrome)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Copy E2E Environment
        run: |
          cp .env.e2e.example .env.e2e
          sed -i 's/E2E_HEADLESS=false/E2E_HEADLESS=true/g' .env.e2e

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-key' }}

      - name: Start EduMi Server in Background
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for EduMi Server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Smoke Test
        run: npm run test:e2e -- e2e/tests/smoke.test.ts
